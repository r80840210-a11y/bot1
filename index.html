<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StandFade Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2d;
      --accent: #ff4757;
      --gold: #ffa502;
      --text: #ffffff;
      --text-dim: #707589;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    /* Шапка с балансом */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid #2a2e45;
    }
    .brand { font-weight: 900; font-size: 18px; letter-spacing: 1px; color: var(--accent); }
    .balance-box {
      display: flex; align-items: center; gap: 8px;
      background: #111322; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--gold);
    }
    .balance-val { color: var(--gold); font-weight: bold; }

    /* Контент вкладок */
    .tab-content { display: none; padding: 15px; }
    .tab-content.active { display: block; }

    /* Карточки игр */
    .game-card {
      background: linear-gradient(135deg, #1e2235 0%, #141724 100%);
      border-radius: 16px; padding: 16px; margin-bottom: 15px;
      border: 1px solid #2e334d; display: flex; flex-direction: column; gap: 10px;
    }
    .game-title { font-size: 18px; font-weight: bold; }
    .btn-play {
      background: var(--accent); color: #fff; border: none; padding: 10px;
      border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase;
    }

    /* Нижняя навигация */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
      background: #141622; border-top: 1px solid #282c42;
      display: flex; justify-content: space-around; align-items: center;
      backdrop-filter: blur(10px);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-dim); text-decoration: none; font-size: 11px; font-weight: 600;
      background: none; border: none; width: 25%;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="brand">STANDFADE</div>
    <div class="balance-box">
      <span>🪙</span>
      <span class="balance-val" id="balance">1,250</span>
    </div>
  </div>

  <!-- Tab 1: Игры -->
  <div id="games" class="tab-content active">
    <div class="game-card">
      <div class="game-title">🎯 Рулетка StandFade</div>
      <p style="color: #a0a5b8; font-size: 13px;">Крути барабан и выбивай редкие скины!</p>
      <button class="btn-play">Играть</button>
    </div>
    <div class="game-card">
      <div class="game-title">💣 Мины</div>
      <p style="color: #a0a5b8; font-size: 13px;">Открывай ячейки и забирай иксы.</p>
      <button class="btn-play">Играть</button>
    </div>
  </div>

  <!-- Tab 2: Инвентарь -->
  <div id="inventory" class="tab-content">
    <h3>Твой инвентарь</h3>
    <p style="color: #707589; margin-top: 10px;">У тебя пока нет предметов.</p>
  </div>

  <!-- Tab 3: Профиль -->
  <div id="profile" class="tab-content">
    <h3>Профиль игрока</h3>
    <p style="color: #707589; margin-top: 10px;">ID: 94820491</p>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('games', this)">
      <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      Игры
    </button>
    <button class="nav-item" onclick="switchTab('inventory', this)">
      <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
      Инвентарь
    </button>
    <button class="nav-item" onclick="switchTab('profile', this)">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Профиль
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачивает Mini App на весь экран

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }
  </script>
</body>
</html>
