services:
  - type: web
    name: ordogram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ordogram-db
          property: connectionString
      - key: ORDOGRAM_API_KEY
        sync: false
      - key: PORT
        value: "10000"

databases:
  - name: ordogram-db
    plan: free
